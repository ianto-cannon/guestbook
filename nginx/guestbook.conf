server {
    listen 127.0.0.1:80;
    listen [::1]:80;

    server_name guestbook.maricakes.de;

    root /var/www/guestbook;

    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    # PHP API only
    location = /api.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
}
